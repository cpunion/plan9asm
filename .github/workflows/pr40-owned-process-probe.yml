name: PR40 Windows owned-process diagnostics
on:
  push:
    branches: [codex/pr40-windows-owned-process-probe-20261013]
permissions:
  contents: read
jobs:
  native-x86-oracles:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Install LLVM 22 and required native i386 toolchain
        timeout-minutes: 14
        run: bash scripts/install-ci-llvm22-ubuntu.sh gcc-i686-linux-gnu libc6-dev-i386-cross
      - uses: ./.github/actions/setup-go
        with:
          go-version: '1.27.2'
          cache: true
      - name: Check actual native flags, ABI transport and guarded memory
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          mkdir -p _out/native-x86-oracles
          roots='TestX86OriginalSysVDirectAndPointerTransport'
          roots+='|TestX86MemoryFault.*|TestX86CMPXCHGFault.*|TestX86CMPXCHGWindowsFaultCodes'
          roots+='|TestX86NativeWindowsPrecisionFaultCode|TestX86SignedConversionFaultWindowsHeaderBoundary'
          roots+='|TestX86GoPackedStoreFaultDiagnostic|TestRuntimeOracleFault.*'
          roots+='|TestRuntimeOracleNativeCActualHeadersAndLink|TestGoX86NumericalSBReadRuntimeFaultObservation'
          roots+='|TestCrossLinuxRuntimeMatrixX86TLSNoopPreservesWideGP'
          static_read_root='TestX86RawReturnStaticReadNumericOracle'
          go test . -list "^($static_read_root)$" > _out/native-x86-oracles/static-read-inventory.log
          grep -Fx "$static_read_root" _out/native-x86-oracles/static-read-inventory.log
          roots+="|$static_read_root"
          alias_roots='TestCrossLinuxRuntimeMatrixX86MOVQSourceAliasesOriginalAndLLVM'
          alias_roots+='|TestCrossLinuxRuntimeMatrixX86MOVQSourceAliasesCountedProvenance'
          go test . -list "^($alias_roots)$" > _out/native-x86-oracles/alias-inventory.log
          for root in ${alias_roots//|/ }; do
            grep -Fx "$root" _out/native-x86-oracles/alias-inventory.log
          done
          roots+="|$alias_roots"
          bool_roots='TestCrossLinuxRuntimeMatrixAMD64RegisterCanonicalBoolInstructionBytes'
          bool_roots+='|TestCrossLinuxRuntimeMatrixGoAMD64CanonicalBoolByteRepresentation'
          go test . -list "^($bool_roots)$" > _out/native-x86-oracles/bool-inventory.log
          for root in ${bool_roots//|/ }; do
            grep -Fx "$root" _out/native-x86-oracles/bool-inventory.log
          done
          roots+="|$bool_roots"
          numerical_roots='TestCrossLinuxRuntimeMatrixX86NumericalSBReadMutableAMD64'
          numerical_roots+='|TestCrossLinuxRuntimeMatrixX86NumericalSBReadMutableLocalAMD64'
          go test . -list "^($numerical_roots)$" > _out/native-x86-oracles/numerical-inventory.log
          for root in ${numerical_roots//|/ }; do
            grep -Fx "$root" _out/native-x86-oracles/numerical-inventory.log
          done
          roots+="|$numerical_roots"
          caller_roots='TestCrossLinuxRuntimeMatrixX86CallerAddressInstructionBytesAndLLVM'
          caller_roots+='|TestCrossLinuxRuntimeMatrixGoX86CallerAddressABI0Representation'
          go test . -list "^($caller_roots)$" > _out/native-x86-oracles/caller-inventory.log
          for root in ${caller_roots//|/ }; do
            grep -Fx "$root" _out/native-x86-oracles/caller-inventory.log
          done
          roots+="|$caller_roots"
          caller_cmp_roots='TestCrossLinuxRuntimeMatrixX86CallerAddressCMPInstructionBytesAndLLVM'
          caller_cmp_roots+='|TestCrossLinuxRuntimeMatrixGoX86CallerAddressCMPABI0Representation'
          go test . -list "^($caller_cmp_roots)$" > _out/native-x86-oracles/caller-cmp-inventory.log
          for root in ${caller_cmp_roots//|/ }; do
            grep -Fx "$root" _out/native-x86-oracles/caller-cmp-inventory.log
          done
          roots+="|$caller_cmp_roots"
          numerical_lea_root='TestCrossLinuxRuntimeMatrixX86NumericalLEAOriginalBytesAndLLVM'
          go test . -list "^($numerical_lea_root)$" > _out/native-x86-oracles/numerical-lea-inventory.log
          grep -Fx "$numerical_lea_root" _out/native-x86-oracles/numerical-lea-inventory.log
          roots+="|$numerical_lea_root"
          direct_tail_roots='TestCrossLinuxRuntimeMatrixAMD64DirectTailWholeSourceOriginalGoAndLLVM'
          direct_tail_roots+='|TestCrossLinuxRuntimeMatrixX86DirectTail386OriginalGoAndLLVM'
          direct_tail_roots+='|TestCrossLinuxRuntimeMatrixX86DirectTailPCResultAliasesAndExternal'
          go test . -list "^($direct_tail_roots)$" > _out/native-x86-oracles/direct-tail-inventory.log
          for root in ${direct_tail_roots//|/ }; do
            grep -Fx "$root" _out/native-x86-oracles/direct-tail-inventory.log
          done
          roots+="|$direct_tail_roots"
          gp_simd_sparse_roots='TestCrossLinuxRuntimeMatrixX86GPSIMDSparseNativeAMD64OriginalGoAndLLVM'
          gp_simd_sparse_roots+='|TestCrossLinuxRuntimeMatrixX86GPSIMDSparseNative386OriginalGoAndLLVM'
          go test . -list "^($gp_simd_sparse_roots)$" > _out/native-x86-oracles/gp-simd-sparse-inventory.log
          for root in ${gp_simd_sparse_roots//|/ }; do
            grep -Fx "$root" _out/native-x86-oracles/gp-simd-sparse-inventory.log
          done
          roots+="|$gp_simd_sparse_roots"
          bit_scan_roots='TestCrossLinuxRuntimeMatrixX86BitScanNativeAMD64OriginalGoAndLLVM'
          bit_scan_roots+='|TestCrossLinuxRuntimeMatrixX86BitScanNative386OriginalGoAndLLVM'
          go test . -list "^($bit_scan_roots)$" > _out/native-x86-oracles/bit-scan-inventory.log
          for root in ${bit_scan_roots//|/ }; do
            grep -Fx "$root" _out/native-x86-oracles/bit-scan-inventory.log
          done
          roots+="|$bit_scan_roots"
          bool_386_root='TestCrossLinuxRuntimeMatrixX86ABI0Mode32CanonicalBoolOriginalGoAndLLVM'
          go test . -list "^($bool_386_root)$" > _out/native-x86-oracles/bool-386-inventory.log
          grep -Fx "$bool_386_root" _out/native-x86-oracles/bool-386-inventory.log
          roots+="|$bool_386_root"
          packed_string_root='TestCrossLinuxRuntimeMatrixX86PackedStringImplicitVectorNativeAVX'
          go test . -list "^($packed_string_root)$" > _out/native-x86-oracles/packed-string-inventory.log
          grep -Fx "$packed_string_root" _out/native-x86-oracles/packed-string-inventory.log
          roots+="|$packed_string_root"
          packed_string_fault_root='TestCrossLinuxRuntimeMatrixX86PackedStringOriginalNativeMemoryFaults'
          go test . -list "^($packed_string_fault_root)$" > _out/native-x86-oracles/packed-string-fault-inventory.log
          grep -Fx "$packed_string_fault_root" _out/native-x86-oracles/packed-string-fault-inventory.log
          roots+="|$packed_string_fault_root"
          independent_fp_roots='TestCrossLinuxRuntimeMatrixX86InsertExtractIndependentFPFields'
          independent_fp_roots+='|TestCrossLinuxRuntimeMatrixX86LegacyPSIndependentFPFields'
          go test . -list "^($independent_fp_roots)$" > _out/native-x86-oracles/independent-fp-inventory.log
          for root in ${independent_fp_roots//|/ }; do
            grep -Fx "$root" _out/native-x86-oracles/independent-fp-inventory.log
          done
          roots+="|$independent_fp_roots"
          source_stack_root='TestCrossLinuxRuntimeMatrixX86RawSourceStackNumerical'
          go test . -list "^($source_stack_root)$" > _out/native-x86-oracles/source-stack-inventory.log
          grep -Fx "$source_stack_root" _out/native-x86-oracles/source-stack-inventory.log
          roots+="|$source_stack_root"
          continuation_root='TestCrossLinuxRuntimeMatrixX86ContinuationWholeCFGOriginalGoAndLLVM'
          go test . -list "^($continuation_root)$" > _out/native-x86-oracles/continuation-inventory.log
          grep -Fx "$continuation_root" _out/native-x86-oracles/continuation-inventory.log
          roots+="|$continuation_root"
          byte_swap_root='TestCrossLinuxRuntimeMatrixX86ByteSwapOriginalGoAndLLVM'
          go test . -list "^($byte_swap_root)$" > _out/native-x86-oracles/byte-swap-inventory.log
          grep -Fx "$byte_swap_root" _out/native-x86-oracles/byte-swap-inventory.log
          roots+="|$byte_swap_root"
          crc32_root='TestAMD64CRC32RuntimeSemanticsAndFlags'
          go test . -list "^($crc32_root)$" > _out/native-x86-oracles/crc32-inventory.log
          grep -Fx "$crc32_root" _out/native-x86-oracles/crc32-inventory.log
          roots+="|$crc32_root"
          bit_test_root='TestCrossLinuxRuntimeMatrixX86BitTestNumericalAndAliases'
          go test . -list "^($bit_test_root)$" > _out/native-x86-oracles/bit-test-inventory.log
          grep -Fx "$bit_test_root" _out/native-x86-oracles/bit-test-inventory.log
          roots+="|$bit_test_root"
          families='MADDTypedOriginalLegacy|PackedNarrowOriginalLegacyOracle|ScalarFPBitViewsOriginalBitsAndCanaries'
          families+='|PureGPUnknownDeadOutputs|SignedIntegerScalarFloatTranslatedFPFields|ScalarCompareFlags'
          families+='|RawReturnSourceAddressNumerical|FloatingCompareOriginalLegacyPredicates|TimestampOriginalAndLLVM'
          families+='|PackedWordMultiplySoftwareMaskedMemory|PackedAverageInactiveMemory|PackedZeroExtendCompleteBytes'
          families+='|InsertInactiveMemoryStillFaults|PackedUnpackZeroMaskStillFaults|PackedNarrowIndependentE4NF'
          families+='|PackedShiftNativeReadFaults|PackedUnpackMMXNativeMemoryAndFP|PackedZeroMemoryStoreFault'
          families+='|SignedIntegerScalarFloatNativeReadExtentAndPrecision|SignedIntegerScalarFloatNativeLinuxPrecisionSignal'
          go test . -list "^($roots|TestCrossLinuxRuntimeMatrixX86($families))$" > _out/native-x86-oracles/all-roots.stdout
          test "$(grep -c '^Test' _out/native-x86-oracles/all-roots.stdout)" = 66
          go test . -run "^($roots|TestCrossLinuxRuntimeMatrixX86($families))$" \
            -json -count=1 -timeout=8m \
            2> _out/native-x86-oracles/native.stderr | tee _out/native-x86-oracles/native.jsonl
          node .github/scripts/audit-native-priority.cjs _out/native-x86-oracles > _out/native-x86-oracles/audit.json
      - name: Preserve original and translated observations
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: native-x86-oracles
          path: _out/native-x86-oracles/
          if-no-files-found: error

  complete-windows:
    needs: [ownership, native-x86-oracles, sdk-priority, arm64-fallback-cross-priority, lock-native-priority, unlocked-rmw-native-priority, vector-value-fault-priority]
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        module: [root, plan9asm, plan9asmll]
    uses: ./.github/workflows/windows-module.yml
    with:
      module: ${{ matrix.module }}

  sdk-priority:
    name: SDK priority (${{ matrix.lane }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: completed-ci-repair
            module: '.'
            roots:
              - TestTranslateIRTextCoverage
              - TestX86RawSegmentAbsoluteMemory
              - TestX86ResultCompareExchangePrefixAndAuthorityBoundaries
              - TestTranslate386RejectsInvalidInstructionForms
              - TestX86RawReturnBoundFPAndStaticObjects
