          roots+='|TestAMD64X87ConditionalMoveRuntimeConditions'
          roots+='|TestX86RawX87ClearExceptionRuntimeSemantics'
          roots+='|TestX86RawX87SoftwareClearPreservesAllStatusFields'
          go test -p=1 . -list "^($roots)$" > _out/native-x87/inventory.log
