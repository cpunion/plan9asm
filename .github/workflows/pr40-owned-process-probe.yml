name: PR40 amd64 family native diagnostics

on:
  push:
    branches: [codex/pr40-amd64-family-native-probe-20261026]

permissions:
  contents: read

jobs:
  native-amd64-families:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOMAXPROCS: '4'
      GOTOOLCHAIN: local
      SOURCE_HEAD: 'ea3915207213109470a6031c29048a1e1e175d0a'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 3
      - name: Install LLVM 22
        timeout-minutes: 14
        run: bash scripts/install-ci-llvm22-ubuntu.sh

      - uses: ./.github/actions/setup-go
        with:
          go-version: '1.27.3'
          cache: true

      - name: Run the complete selected native inventory
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          mkdir -p _out/amd64-gp-native
          git rev-parse HEAD > _out/amd64-gp-native/head.txt
          git rev-parse HEAD^ > _out/amd64-gp-native/parent-head.txt
          git rev-parse "$SOURCE_HEAD" > _out/amd64-gp-native/source-head.txt
          git merge-base --is-ancestor "$SOURCE_HEAD" HEAD
          git diff --exit-code "$SOURCE_HEAD" HEAD -- . \
            ':(exclude).github/workflows/pr40-owned-process-probe.yml'
          git diff --name-only "$SOURCE_HEAD" HEAD > _out/amd64-gp-native/source-diff.txt
          test "$(cat _out/amd64-gp-native/source-diff.txt)" = .github/workflows/pr40-owned-process-probe.yml
          test "$(uname -m)" = x86_64
          test "$(go env GOARCH)" = amd64
          go version > _out/amd64-gp-native/go-version.txt
          llc-22 --version > _out/amd64-gp-native/llvm-version.txt
          clang-22 --version > _out/amd64-gp-native/clang-version.txt

          # Legacy binary kernels include SSSE3 and SSE4.1, not only SSE2.
          # Missing hardware fails before execution; it is never a passing skip.
          clang-22 -x c - -o _out/amd64-gp-native/isa-preflight <<'C'
          #include <cpuid.h>
          #include <stdio.h>
          int main(void) {
              unsigned a, b, c, d;
              if (!__get_cpuid(1, &a, &b, &c, &d)) return 2;
              unsigned sse2 = !!(d & bit_SSE2);
              unsigned ssse3 = !!(c & bit_SSSE3);
              unsigned sse41 = !!(c & bit_SSE4_1);
              printf("SSE2=%u SSSE3=%u SSE4.1=%u\n", sse2, ssse3, sse41);
              return !(sse2 && ssse3 && sse41);
          }
          C
          _out/amd64-gp-native/isa-preflight | tee _out/amd64-gp-native/isa-preflight.txt

          roots=(
            TestGoAMD64FixedLocalTypedGPRuntimeObjects
            TestGoAMD64FixedLocalTypedBinaryObjects
            TestGoAMD64FixedLocalDefinedGPBank
            TestGoAMD64FixedLocalDefinedGPBankRoles
            TestCrossLinuxRuntimeMatrixGoAMD64FixedLocalTypedGP
            TestCrossLinuxRuntimeMatrixGoAMD64FixedLocalTypedBinary
            TestCrossLinuxRuntimeMatrixGoAMD64FixedLocalAffine
            TestCrossLinuxRuntimeMatrixX86ScalarArithmeticNativeResultsAndFaults
            TestCrossLinuxRuntimeMatrixX86ScalarArithmeticNativeFlagsAndAliases
            TestGoAMD64FixedLocalInputMemoryDeadReadFaults
            TestGoAMD64FixedLocalInputMemoryDeadMultiplyFaults
            TestGoAMD64FixedLocalInputMemoryDeadLogicalFaults
            TestGoAMD64FixedLocalInputAffineMemoryFaults
          )
          selector="^($(IFS='|'; printf '%s' "${roots[*]}"))$"
          printf '%s\n' "${roots[@]}" | LC_ALL=C sort > _out/amd64-gp-native/expected.txt
          printf '%s\n' '{
            "TestGoAMD64FixedLocalTypedGPRuntimeObjects": 3,
            "TestGoAMD64FixedLocalTypedBinaryObjects": 12,
            "TestGoAMD64FixedLocalDefinedGPBank": 70,
            "TestGoAMD64FixedLocalDefinedGPBankRoles": 12,
            "TestCrossLinuxRuntimeMatrixGoAMD64FixedLocalTypedGP": 9,
            "TestCrossLinuxRuntimeMatrixGoAMD64FixedLocalTypedBinary": 9,
            "TestCrossLinuxRuntimeMatrixGoAMD64FixedLocalAffine": 9,
            "TestCrossLinuxRuntimeMatrixX86ScalarArithmeticNativeResultsAndFaults": 9,
            "TestCrossLinuxRuntimeMatrixX86ScalarArithmeticNativeFlagsAndAliases": 9,
            "TestGoAMD64FixedLocalInputMemoryDeadReadFaults": 9,
            "TestGoAMD64FixedLocalInputMemoryDeadMultiplyFaults": 9,
            "TestGoAMD64FixedLocalInputMemoryDeadLogicalFaults": 9,
            "TestGoAMD64FixedLocalInputAffineMemoryFaults": 9
          }' > _out/amd64-gp-native/expected-child-counts.json
          go test -p=1 . -list "$selector" > _out/amd64-gp-native/inventory.log
          grep '^Test' _out/amd64-gp-native/inventory.log | LC_ALL=C sort > _out/amd64-gp-native/selected.txt
          diff -u _out/amd64-gp-native/expected.txt _out/amd64-gp-native/selected.txt
          go test -p=1 . -run "$selector" -count=1 -timeout=15m -json \
            | tee _out/amd64-gp-native/results.jsonl

      - name: Require exact roots and complete child terminals without skips
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          jq -se --rawfile expected _out/amd64-gp-native/expected.txt \
            --slurpfile counts _out/amd64-gp-native/expected-child-counts.json '
            . as $events
            | ($expected | split("\n") | map(select(length > 0)) | sort) as $roots
            | ([.[] | select(.Test != null) | .Test] | unique) as $tests
            | if ([.[] | select(.Action == "pass" and .Test != null and (.Test | contains("/") | not)) | .Test] | sort) == $roots
              and all(.[]; .Action != "fail" and .Action != "skip")
              and any(.[]; .Action == "pass" and .Test == null)
              and all($tests[]; . as $name
                | ([$events[] | select(.Test == $name and .Action == "run")] | length) == 1
                  and ([$events[] | select(.Test == $name and .Action == "pass")] | length) == 1)
              and ($counts[0] | keys | sort) == $roots
              and all($roots[]; . as $root
                | ([$tests[] | select(startswith($root + "/"))] | length) == $counts[0][$root])
              then [$roots[] as $root | {
                root: $root,
                children: [$tests[] | select(startswith($root + "/"))],
                root_pass: true
              }]
              else error("missing, duplicate, failed, skipped or incomplete selected test")
              end
          ' _out/amd64-gp-native/results.jsonl | tee _out/amd64-gp-native/root-outcomes.json

      - name: Upload exact native execution evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: amd64-gp-native
          path: _out/amd64-gp-native
          if-no-files-found: error
