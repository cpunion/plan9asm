name: PR40 Windows owned-process diagnostics
on:
  push:
    branches: [codex/pr40-windows-owned-process-probe-20261013]
permissions:
  contents: read
jobs:
  native-x86-oracles:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Install LLVM 22 and required native i386 toolchain
        timeout-minutes: 14
        run: bash scripts/install-ci-llvm22-ubuntu.sh gcc-i686-linux-gnu libc6-dev-i386-cross
      - uses: ./.github/actions/setup-go
        with:
          go-version: '1.27.2'
          cache: true
      - name: Check actual native flags, ABI transport and guarded memory
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          mkdir -p _out/native-x86-oracles
          roots='TestX86RawReturnStaticReadNumericOracle|TestX86OriginalSysVDirectAndPointerTransport'
          roots+='|TestX86MemoryFault.*|TestX86CMPXCHGFault.*|TestX86CMPXCHGWindowsFaultCodes'
          roots+='|TestX86NativeWindowsPrecisionFaultCode|TestX86SignedConversionFaultWindowsHeaderBoundary'
          roots+='|TestX86GoPackedStoreFaultDiagnostic|TestRuntimeOracleFault.*'
          roots+='|TestRuntimeOracleNativeCActualHeadersAndLink|TestGoX86NumericalSBReadRuntimeFaultObservation'
          roots+='|TestCrossLinuxRuntimeMatrixX86TLSNoopPreservesWideGP'
          alias_roots='TestCrossLinuxRuntimeMatrixX86MOVQSourceAliasesOriginalAndLLVM'
          alias_roots+='|TestCrossLinuxRuntimeMatrixX86MOVQSourceAliasesCountedProvenance'
          go test . -list "^($alias_roots)$" > _out/native-x86-oracles/alias-inventory.log
          for root in ${alias_roots//|/ }; do
            grep -Fx "$root" _out/native-x86-oracles/alias-inventory.log
          done
          roots+="|$alias_roots"
          bool_roots='TestCrossLinuxRuntimeMatrixAMD64RegisterCanonicalBoolInstructionBytes'
          bool_roots+='|TestCrossLinuxRuntimeMatrixGoAMD64CanonicalBoolByteRepresentation'
          go test . -list "^($bool_roots)$" > _out/native-x86-oracles/bool-inventory.log
          for root in ${bool_roots//|/ }; do
            grep -Fx "$root" _out/native-x86-oracles/bool-inventory.log
          done
          roots+="|$bool_roots"
          numerical_roots='TestCrossLinuxRuntimeMatrixX86NumericalSBReadMutableAMD64'
          numerical_roots+='|TestCrossLinuxRuntimeMatrixX86NumericalSBReadMutableLocalAMD64'
          go test . -list "^($numerical_roots)$" > _out/native-x86-oracles/numerical-inventory.log
          for root in ${numerical_roots//|/ }; do
            grep -Fx "$root" _out/native-x86-oracles/numerical-inventory.log
          done
          roots+="|$numerical_roots"
          caller_roots='TestCrossLinuxRuntimeMatrixX86CallerAddressInstructionBytesAndLLVM'
          caller_roots+='|TestCrossLinuxRuntimeMatrixGoX86CallerAddressABI0Representation'
          go test . -list "^($caller_roots)$" > _out/native-x86-oracles/caller-inventory.log
          for root in ${caller_roots//|/ }; do
            grep -Fx "$root" _out/native-x86-oracles/caller-inventory.log
          done
          roots+="|$caller_roots"
          caller_cmp_roots='TestCrossLinuxRuntimeMatrixX86CallerAddressCMPInstructionBytesAndLLVM'
          caller_cmp_roots+='|TestCrossLinuxRuntimeMatrixGoX86CallerAddressCMPABI0Representation'
          go test . -list "^($caller_cmp_roots)$" > _out/native-x86-oracles/caller-cmp-inventory.log
          for root in ${caller_cmp_roots//|/ }; do
            grep -Fx "$root" _out/native-x86-oracles/caller-cmp-inventory.log
          done
          roots+="|$caller_cmp_roots"
          numerical_lea_root='TestCrossLinuxRuntimeMatrixX86NumericalLEAOriginalBytesAndLLVM'
          go test . -list "^($numerical_lea_root)$" > _out/native-x86-oracles/numerical-lea-inventory.log
          grep -Fx "$numerical_lea_root" _out/native-x86-oracles/numerical-lea-inventory.log
          roots+="|$numerical_lea_root"
          direct_tail_roots='TestCrossLinuxRuntimeMatrixAMD64DirectTailWholeSourceOriginalGoAndLLVM'
          direct_tail_roots+='|TestCrossLinuxRuntimeMatrixX86DirectTail386OriginalGoAndLLVM'
          direct_tail_roots+='|TestCrossLinuxRuntimeMatrixX86DirectTailPCResultAliasesAndExternal'
          go test . -list "^($direct_tail_roots)$" > _out/native-x86-oracles/direct-tail-inventory.log
          for root in ${direct_tail_roots//|/ }; do
            grep -Fx "$root" _out/native-x86-oracles/direct-tail-inventory.log
          done
          roots+="|$direct_tail_roots"
          families='MADDTypedOriginalLegacy|PackedNarrowOriginalLegacyOracle|ScalarFPBitViewsOriginalBitsAndCanaries'
          families+='|PureGPUnknownDeadOutputs|SignedIntegerScalarFloatTranslatedFPFields|ScalarCompareFlags'
          families+='|RawReturnSourceAddressNumerical|FloatingCompareOriginalLegacyPredicates|TimestampOriginalAndLLVM'
          families+='|PackedWordMultiplySoftwareMaskedMemory|PackedAverageInactiveMemory|PackedZeroExtendCompleteBytes'
          families+='|InsertInactiveMemoryStillFaults|PackedUnpackZeroMaskStillFaults|PackedNarrowIndependentE4NF'
          families+='|PackedShiftNativeReadFaults|PackedUnpackMMXNativeMemoryAndFP|PackedZeroMemoryStoreFault'
          families+='|SignedIntegerScalarFloatNativeReadExtentAndPrecision|SignedIntegerScalarFloatNativeLinuxPrecisionSignal'
          go test . -run "^($roots|TestCrossLinuxRuntimeMatrixX86($families))$" \
            -v -count=1 -timeout=8m 2>&1 | tee _out/native-x86-oracles/native.log
      - name: Preserve original and translated observations
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: native-x86-oracles
          path: _out/native-x86-oracles/
          if-no-files-found: error

  complete-windows:
    needs: [ownership, sdk-priority]
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        module: [root, plan9asm, plan9asmll]
    uses: ./.github/workflows/windows-module.yml
    with:
      module: ${{ matrix.module }}

  sdk-priority:
    name: SDK priority (${{ matrix.lane }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: llvm
            module: cmd/plan9asmll
            roots:
              - TestX86SDKNumericalOwnerQueryIsNotPackageExemption
              - TestRunOneTargetSDKFixedLocalPreservesActualDefaultProfile
              - TestRunOneTargetSDKFixedLocalCanonicalCommandPaths
              - TestOrdinaryPackageLoadSDKWorkingDirectoryIdentity
              - TestOrdinaryPackageLoadOutsideSDKRetainsInternalImportRejection
            timeout: 5m
          - lane: llvm-crc32
            module: cmd/plan9asmll
            roots:
              - TestCompileOneX86SDKOriginalCRC32NumericalDataJoin
            timeout: 5m
          - lane: assembly-selection
            module: cmd/plan9asmll
            roots:
              - TestActualAssemblyMemberExactSelection
              - TestActualAssemblyMemberOriginalAliasLifetime
              - TestActualAssemblyMemberFinalSymlinkIdentity
              - TestARM64ABI0TailActualSelectedMemberDirectoryAlias
              - TestARM64ABI0TailActualSelectedFinalSymlink
              - TestARM64ABI0TailOriginalAliasPostGuard
              - TestX86CallerCLIActualSelectedMemberDirectoryAlias
              - TestX86CallerCLIOriginalAliasFinalSourceGuard
              - TestX86CallerCLIActualSelectedFinalSymlink
              - TestX86CallerCLIOriginalAliasFiveTargetObjects
              - TestCompileOneARM64ABI0TailActualDeclaration
              - TestCompileOneARM64ABI0TailCompleteAndChunks
              - TestCompileOneARM64ABI0TailSourcePostGuard
              - TestReflectDynamicStubNativeObjectsRetainContext
              - TestReflectDynamicStubSelectedAssemblyIdentity
              - TestReflectDynamicStubSelectedAssemblyRejectsUnboundIdentity
            timeout: 5m
          - lane: literal-minimum-simple
            module: cmd/plan9asm
            roots:
              - TestSimpleCLIOriginalSDKMapsLiteralMinimumSource
            timeout: 8m
          - lane: literal-minimum-llvm
            module: cmd/plan9asmll
            roots:
              - TestCompileOneX86SDKOriginalMapsLiteralMinimumSource
            timeout: 5m
          - lane: metadata-only
            module: internal/sdkfrontend
            roots:
              - TestSharedSDKMetadataOriginalEmptyDATACompleteThreeOS
            timeout: 10m
          - lane: publication
            module: cmd/plan9asmll
            roots:
              - TestCompileOneCallerLateSourceGuardDoesNotPublish
              - TestCompileOneARM64TailLateSourceGuardDoesNotPublish
              - TestCompileOneFixedLocalLateOwnerGuardDoesNotPublish
              - TestCompileOneContinuationLateReferenceDoesNotPublish
              - TestCompileOutputTransactionSealedInputs
              - TestCompileOutputTransactionDirectoryIdentity
              - TestCompileOutputTransactionRechecksLaterMembers
              - TestCompileOutputTransactionRollbackAndRestoreFailure
              - TestCompileOutputTransactionRollbackDoesNotReplaceConcurrentOutput
              - TestCompileOutputTransactionCommittedCleanupIsExplicit
              - TestCompileOutputTransactionNonretainedObjectPolicy
              - TestCompileOutputRejectsSourceExtensionCaseVariants
              - TestCompileOneOutputCannotReplaceCaseVariantSelectedGoSource
              - TestCompileOneOutputCannotReplaceOriginalModuleMetadata
              - TestCompileOneOutputCannotCreateAbsentMetadataAlias
              - TestCompileOutputMetadataNameProtectionUsesActualParent
              - TestCompileOneOutputCannotReplaceActualSelectedEmbed
              - TestCompileOneLateSelectedEmbedReplacementDoesNotPublish
              - TestCompileOutputInputDirectoryAliasLifetime
              - TestCompileOutputRechecksOriginalInputsDuringPublication
              - TestCompileOutputInputIdentityExcludesEquivalentExistingName
              - TestCompileOutputInputProtectionAccumulatesAttemptMembers
              - TestCompileOutputSuccessfullyReadInputCannotBecomeMissingRole
              - TestCompileOutputInputAliasLifetime
              - TestCompileOutputSearchMissProtection
              - TestCompileOutputSearchMissCannotBePublicDestination
              - TestCompileOneLateEqualByteIncludeRedirectDoesNotPublish
              - TestCompileOneTaskBuilderOutputCannotReplaceActualInclude
              - TestFeatureCPPReadReportRetainsOnlyActiveSearchMisses
            timeout: 5m
          - lane: crc32-linux
            module: cmd/plan9asm
            roots:
              - TestTranslateOriginalSDKCRC32NumericalSource
            timeout: 8m
          - lane: crc32-nonlinux
            module: cmd/plan9asm
            roots:
              - TestTranslateOriginalSDKCRC32NumericalSourceNonLinux
            timeout: 8m
          - lane: crc32-publication
            module: cmd/plan9asm
            roots:
              - TestSimpleCLIOriginalSDKCRC32PublicationAndRejection
            timeout: 8m
          - lane: maps
            module: cmd/plan9asm
            roots:
              - TestSimpleCLIOriginalSDKMapsScalarRegisterSource
            timeout: 8m
          - lane: source
            module: '.'
            roots:
              - TestReadGoAssemblySourceInputsShareExactExpansion
              - TestReadGoAssemblySourceInputsRetainRequestedAliases
              - TestReadGoAssemblySourceReportSeparatesFallbackSearchMiss
              - TestReadGoAssemblySourceReportErrorReturnsNoInventory
              - TestReadGoAssemblySourceExpandsToolchainHeadersInTrimpathBinary
              - TestReadGoAssemblySourceRejectsEscapedSourceAlias
              - TestReadGoAssemblySourceExpandsNestedLocalHeaders
              - TestReadGoAssemblySourceRejectsSymlinkIncludeOutsideRoot
              - TestFrameworkChildGoBuildRetainsParentLLVMMode
              - TestGoX86SDKASMDataOriginalVendorPackageNamespace
              - TestGoX86SDKNumericalReadPackageQueryMatchesOriginalLiteralSource
              - TestSDKAMD64OriginalFrameConfigGuardEagerIdentity
              - TestSDKAMD64OriginalFrameProfileRejectsEqualByteConfigReplacement
              - TestSDKAMD64PrimaryInventoryActualCompleteMD5
              - TestGoX86SDKASMDataOriginalBytealgTextSourceOrder
              - TestSDKAMD64NativeFrameMixedNamespaceSourceOrder
              - TestGoX86SDKNumericalNativeOriginalMixedTextOrder
              - TestGoX86SDKNumericalNativeTextOrderLiveRevocation
            timeout: 5m
          - lane: frame-context
            module: '.'
            roots:
              - TestGoAMD64SDKFrameBindContextCallbacksMayClose
              - TestGoAMD64FrameVerifyContextCallbacksMayClose
              - TestGoAMD64FramePrivateContextExactLifetime
              - TestGoX86NumericalSBReadFrameProducerObserverCancellationCause
              - TestGoSourceContextTerminalSuccessHasNoLaterCallbacks
              - TestGoSourceContextTerminalLostBound
              - TestGoSourceContextTerminalCaptureCannotFreezeStaleLifetime
              - TestGoSourceContextTerminalOriginalErrCannotChangeLifetime
              - TestGoSourceContextTerminalJoinedOwnerCallbackCannotChangeLifetime
              - TestGoSourceContextTerminalCancellationSignalsAndCauses
              - TestGoSourceContextTerminalClosedDoneCannotReturnSuccess
              - TestGoSourceContextTerminalSameContextRolesAreBounded
              - TestGoSourceContextTerminalFrameDoneCannotChangeInLastErr
              - TestGoSourceContextTerminalPrivateBridgeOnlyTightensAndStops
              - TestGoSourceContextTerminalIdentityAndBoundedRoleGuards
            timeout: 5m
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          go-version: '1.27.2'
          cache: true
      - uses: ./.github/actions/setup-windows-llvm22
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check shared command-path identities
        if: ${{ matrix.lane == 'llvm' }}
        shell: bash
        working-directory: internal/sdkfrontend
        env:
          GOTOOLCHAIN: local
          GOFLAGS: ''
          GOENV: 'off'
          GOWORK: 'off'
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/_out/windows-sdk-priority"
          mkdir -p "$report"
          roots='TestOrdinaryEnvironmentActualCommandPathIdentity'
          roots+='|TestOrdinaryEnvironmentCommandPathRejectionPreservesInputs'
          roots+='|TestOrdinaryEnvironmentRetainsGOPATHComponentSelection'
          roots+='|TestWorkingDirectoryActualIdentity'
          roots+='|TestWorkingDirectoryRejectsMissingOrNonDirectory'
          go test -tags=byollvm . -list "^($roots)$" > "$report/shared-path-inventory.log"
          for root in ${roots//|/ }; do
            grep -Fx "$root" "$report/shared-path-inventory.log"
          done
          go test -tags=byollvm . -run "^($roots)$" -count=1 -timeout=5m -v \
            2>&1 | tee "$report/shared-path-tests.log"
      - name: Check exact SDK priority inventory (${{ matrix.lane }})
        shell: bash
        working-directory: ${{ matrix.module }}
        env:
          GOTOOLCHAIN: local
          GOFLAGS: ''
          GOENV: 'off'
          GOWORK: 'off'
          SDK_PRIORITY_ROOTS: ${{ join(matrix.roots, '|') }}
          SDK_PRIORITY_TIMEOUT: ${{ matrix.timeout }}
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/_out/windows-sdk-priority"
          mkdir -p "$report"
          go test -tags=byollvm . -list "^($SDK_PRIORITY_ROOTS)$" > "$report/inventory.log"
          for root in ${SDK_PRIORITY_ROOTS//|/ }; do
            grep -Fx "$root" "$report/inventory.log"
          done
          go test -tags=byollvm . -run "^($SDK_PRIORITY_ROOTS)$" -count=1 \
            -timeout="$SDK_PRIORITY_TIMEOUT" -v 2>&1 | tee "$report/tests.log"
      - name: Preserve independently inventoried SDK results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: windows-sdk-priority-${{ matrix.lane }}
          path: _out/windows-sdk-priority/
          if-no-files-found: error

  ownership:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ['1.20.14', '1.27.2']
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - uses: ./.github/actions/setup-windows-llvm22
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check the previous native root failures first
        shell: bash
        env:
          GOTOOLCHAIN: local
          GOFLAGS: ''
        run: |
          set -euo pipefail
          mkdir -p _out/windows-ownership
          roots='TestCrossLinuxRuntimeMatrixX86PackedZeroMemoryStoreFault|TestX86GoPackedStoreFaultDiagnostic'
          roots+='|TestTranslate386InstructionFamilies|TestRuntimeOracleSinkRejectsMissingEntryAndEarlyExit'
          go test -tags=byollvm . -list "^($roots)$" > _out/windows-ownership/priority-inventory.log
          for root in ${roots//|/ }; do
            grep -Fx "$root" _out/windows-ownership/priority-inventory.log
          done
          go test -tags=byollvm . -run "^($roots)$" -count=1 -timeout=5m -v \
            2>&1 | tee _out/windows-ownership/priority-roots.log
      - name: Check canonical bool and source-query portable controls
        shell: bash
        env:
          GOTOOLCHAIN: local
          GOFLAGS: ''
        run: |
          set -euo pipefail
          mkdir -p _out/windows-ownership
          roots='TestAMD64RegisterBoolCanonicalResultThreeAPIs'
          roots+='|TestAMD64RegisterBoolInitializedIsNotCanonical'
          roots+='|TestAMD64RegisterBoolCanonicalTypedTransferFamilies'
          roots+='|TestAMD64RegisterBoolThreeTargetOriginalAndLLVMObjects'
          roots+='|TestNumericalRawSelectionPreservesActualPackageQuery'
          roots+='|TestNumericalSourcePackageQueryKeepsSourceRolesDistinct'
          roots+='|TestSDKAMD64OriginalFrameConfigGuardEagerIdentity'
          go test -tags=byollvm . -list "^($roots)$" > _out/windows-ownership/portable-inventory.log
          for root in ${roots//|/ }; do
            grep -Fx "$root" _out/windows-ownership/portable-inventory.log
          done
          go test -tags=byollvm . -run "^($roots)$" -count=1 -timeout=5m -v \
            2>&1 | tee _out/windows-ownership/portable.log
      - name: Check actual shared command paths on both SDKs
        shell: bash
        env:
          GOTOOLCHAIN: local
          GOFLAGS: ''
          GOENV: 'off'
          GOWORK: 'off'
        run: |
          set -euo pipefail
          mkdir -p _out/windows-ownership
          roots='TestGoEnvFileSelection'
          roots+='|TestOrdinaryEnvironmentActualCommandPathIdentity'
          roots+='|TestOrdinaryEnvironmentCommandPathRejectionPreservesInputs'
          roots+='|TestOrdinaryEnvironmentRetainsGOPATHComponentSelection'
          roots+='|TestWorkingDirectoryActualIdentity'
          roots+='|TestWorkingDirectoryRejectsMissingOrNonDirectory'
          go test -tags=byollvm ./internal/sdkfrontend -list "^($roots)$" \
            > _out/windows-ownership/command-path-inventory.log
          for root in ${roots//|/ }; do
            grep -Fx "$root" _out/windows-ownership/command-path-inventory.log
          done
          go test -tags=byollvm ./internal/sdkfrontend -run "^($roots)$" \
            -count=1 -timeout=5m -v 2>&1 | tee _out/windows-ownership/command-path-tests.log
      - name: Real process-tree and exhaustive runner regressions
        shell: bash
        env:
          GOTOOLCHAIN: local
          GOFLAGS: ''
        run: |
          set -euo pipefail
          mkdir -p _out/windows-ownership
          go test ./internal/ownedprocess ./internal/sourcepath ./cmd/plan9asmtest -count=1 -timeout=8m -v 2>&1 | tee _out/windows-ownership/native.log
      - name: Repeat real process termination races
        shell: bash
        env:
          GOTOOLCHAIN: local
          GOFLAGS: ''
        run: |
          set -euo pipefail
          go test ./cmd/plan9asmtest -run '^TestWindowsOwnedCommand' -count=25 -timeout=8m -v 2>&1 | tee _out/windows-ownership/repeated.log
      - name: Preserve native results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: owned-process-${{ matrix.go }}
          path: _out/windows-ownership/
          if-no-files-found: error
