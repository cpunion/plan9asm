  x87-native-priority:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: local
      GOENV: 'off'
      GOWORK: 'off'
      GOFLAGS: ''
    steps:
      - uses: actions/checkout@v7
      - name: Install LLVM 22 and actual native i386 link tools
        timeout-minutes: 14
