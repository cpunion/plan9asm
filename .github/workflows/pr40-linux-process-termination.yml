name: PR40 Linux process termination probe

on:
  push:
    branches: [codex/pr40-linux-process-termination-20261026]

permissions:
  contents: read

jobs:
  linux-process-termination:
    if: github.repository == 'cpunion/plan9asm'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      GOENV: 'off'
      GOWORK: 'off'
      GOFLAGS: ''
      GOMAXPROCS: '2'
      LLVM_CONFIG: llvm-config-22
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Install LLVM 22
        timeout-minutes: 14
        run: bash scripts/install-ci-llvm22-ubuntu.sh
      - uses: ./.github/actions/setup-go
        with:
          go-version: '1.27.2'
          cache: false
      - uses: ./.github/actions/setup-node22
      - name: Run and audit actual Linux termination regressions
        run: python3 .github/scripts/pr40-linux-process-termination.py
      - name: Retain complete raw observations
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: linux-process-termination-${{ github.run_id }}
          path: _out/linux-process-termination/
          if-no-files-found: error
          retention-days: 14
