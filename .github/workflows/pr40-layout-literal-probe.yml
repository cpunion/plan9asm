name: Layout and logical literal native execution probe

on:
  push:
    branches:
      - codex/pr40-layout-literal-native-20261027

permissions:
  contents: read

jobs:
  native_and_portable:
    if: github.repository == 'cpunion/plan9asm'
    strategy:
      fail-fast: false
      matrix:
        scope: [combined]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOTOOLCHAIN: local
      GOENV: 'off'
      GOWORK: 'off'
      GOFLAGS: ''
      GOMAXPROCS: '4'
      GOOS: linux
      GOARCH: amd64
      LLVM_CONFIG: llvm-config-22
      SOURCE_COMMIT: d2784db04921d1269c18653914d48cab34f73a2c
      NATIVE_SCOPE: ${{ matrix.scope }}
      OWNER_SPECS: |
        {
          "combined": [
            {
              "test": "TestCrossLinuxRuntimeMatrixGoAMD64FixedLocalLayoutPartitions",
              "source": "amd64_fixed_local_terminal_native_linux_amd64_test.go",
              "children": [
                "Translate",
                "Translate/-O0",
                "Translate/-O2",
                "Module",
                "Module/-O0",
                "Module/-O2",
                "GoModule",
                "GoModule/-O0",
                "GoModule/-O2"
              ]
            },
            {
              "test": "TestCrossLinuxRuntimeMatrixGoAMD64FixedLocalLogicalLiterals",
              "source": "amd64_fixed_local_logical_literal_runtime_linux_amd64_test.go",
              "children": [
                "0",
                "0/Translate",
                "0/Translate/-O0",
                "0/Translate/-O2",
                "0/Module",
                "0/Module/-O0",
                "0/Module/-O2",
                "0/GoModule",
                "0/GoModule/-O0",
                "0/GoModule/-O2",
                "1",
                "1/Translate",
                "1/Translate/-O0",
                "1/Translate/-O2",
                "1/Module",
                "1/Module/-O0",
                "1/Module/-O2",
                "1/GoModule",
                "1/GoModule/-O0",
                "1/GoModule/-O2"
              ]
            },
            {
              "test": "TestCrossLinuxRuntimeMatrixX86PackedShiftLiteralMasksOriginalGoAndLLVM",
              "source": "amd64_packed_shift_literal_runtime_test.go",
              "children": [
                "text/-O0",
                "text/-O2",
                "module/-O0",
                "module/-O2",
                "Go/-O0",
                "Go/-O2"
              ]
            }
          ]
        }
      EVIDENCE: _out/layout-literal-execution

    steps:
      - name: Checkout exact diagnostic commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Bind the unchanged source and actual host
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$SOURCE_COMMIT"
          test "$(git diff --name-only "$SOURCE_COMMIT" HEAD)" = '.github/workflows/pr40-layout-literal-probe.yml'
          test -z "$(git status --porcelain)"
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          git rev-parse HEAD > "$EVIDENCE/head.txt"
          git rev-parse HEAD^ > "$EVIDENCE/source.txt"
          git ls-files -z | xargs -0 sha256sum > "$EVIDENCE/checkout.sha256"
          uname -a > "$EVIDENCE/host.txt"
          lscpu --json > "$EVIDENCE/cpu.json"

      - name: Setup exact Go
        uses: ./.github/actions/setup-go
        with:
          go-version: '1.27.3'
          cache: true

      - name: Install LLVM 22
        timeout-minutes: 14
        run: bash scripts/install-ci-llvm22-ubuntu.sh

      - name: Setup existing evidence auditor runtime
        uses: ./.github/actions/setup-node22

      - name: Record and verify actual compiler identities
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = go1.27.3
          test "$(go env GOHOSTOS)" = linux
          test "$(go env GOHOSTARCH)" = amd64
          go version > "$EVIDENCE/go-version.txt"
          go env -json GOVERSION GOROOT GOHOSTOS GOHOSTARCH GOOS GOARCH GOCACHE > "$EVIDENCE/go-env.json"
          : > "$EVIDENCE/tools.sha256"
          for tool in go node llvm-config-22 llc-22 clang-22 opt-22; do
            binary=$(readlink -f "$(command -v "$tool")")
            sha256sum "$binary" >> "$EVIDENCE/tools.sha256"
          done
          for tool in compile asm link objdump nm; do
            binary=$(go tool -n "$tool")
            sha256sum "$binary" >> "$EVIDENCE/tools.sha256"
          done
          test "$(readlink -f "$(command -v llc)")" = "$(readlink -f "$(command -v llc-22)")"
          test "$(readlink -f "$(command -v clang)")" = "$(readlink -f "$(command -v clang-22)")"
          test "$(readlink -f "$(command -v opt)")" = "$(readlink -f "$(command -v opt-22)")"
          llvm-config-22 --version > "$EVIDENCE/llvm-config-version.txt"
          grep -Eq '^22\.' "$EVIDENCE/llvm-config-version.txt"
          for tool in llc-22 clang-22 opt-22; do
            "$tool" --version > "$EVIDENCE/$tool-version.txt"
            grep -Eq 'version 22\.' "$EVIDENCE/$tool-version.txt"
          done

      - name: Require the actual native ISA
        run: |
          set -euo pipefail
          cat > "$EVIDENCE/isa.c" <<'C'
          #include <stdio.h>
          int main(void) {
            __builtin_cpu_init();
            int sse2 = !!__builtin_cpu_supports("sse2");
            int avx2 = !!__builtin_cpu_supports("avx2");
            printf("native ISA SSE2=%d AVX2=%d\n", sse2, avx2);
            return !(sse2 && avx2);
          }
          C
          clang-22 -O2 "$EVIDENCE/isa.c" -o "$EVIDENCE/isa"
          "$EVIDENCE/isa" > "$EVIDENCE/isa.log"
          sha256sum "$EVIDENCE/isa" >> "$EVIDENCE/tools.sha256"

      - name: Discover the exact selected test owners
        run: |
          set -euo pipefail
          node <<'NODE' > "$EVIDENCE/pattern.txt"
          const rows = JSON.parse(process.env.OWNER_SPECS)[process.env.NATIVE_SCOPE];
          process.stdout.write('^(' + rows.map(row => row.test).join('|') + ')$');
          NODE
          pattern=$(cat "$EVIDENCE/pattern.txt")
          go test -p=1 . -list "$pattern" > "$EVIDENCE/inventory.log" 2> "$EVIDENCE/inventory.stderr"

      - name: Execute every selected owner and retain its real terminal
        run: |
          set -uo pipefail
          set +e
          pattern=$(cat "$EVIDENCE/pattern.txt")
          go test -p=1 . -json -run "$pattern" -count=1 -timeout=25m > "$EVIDENCE/raw.jsonl" 2> "$EVIDENCE/native.stderr"
          status=$?
          printf '%s\n' "$status" > "$EVIDENCE/exit.txt"
          exit "$status"

      - name: Audit actual native execution and unchanged identities
        if: always()
        run: |
          set -euo pipefail
          sha256sum --check "$EVIDENCE/checkout.sha256" > "$EVIDENCE/checkout-after.log"
          sha256sum --check "$EVIDENCE/tools.sha256" > "$EVIDENCE/tools-after.log"
          node <<'NODE' > "$EVIDENCE/audit.json"
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const {auditNativeOwners} = require('./.github/scripts/audit-native-owners.cjs');
          const read = name => fs.readFileSync(path.join(process.env.EVIDENCE, name), 'utf8');
          const scope = process.env.NATIVE_SCOPE;
          const owners = JSON.parse(process.env.OWNER_SPECS)[scope];
          const roots = owners.map(owner => owner.test);
          const children = owners.flatMap(owner => owner.children.map(child => owner.test + '/' + child));
          assert.equal(read('exit.txt').trim(), '0', 'native command did not succeed');
          assert.equal(read('source.txt').trim(), process.env.SOURCE_COMMIT);
          assert.equal(read('head.txt').trim(), process.env.GITHUB_SHA);
          const result = auditNativeOwners(read('inventory.log'), read('raw.jsonl'), roots, children);
          const events = read('raw.jsonl').trim().split(/\r?\n/).map(JSON.parse);
          const output = root => events.filter(event => event.Test === root && event.Action === 'output')
            .map(event => event.Output).join('');
          assert.equal(result.roots, 3);
          assert.equal(result.children, 35);
          assert.equal(scope, 'combined');
          assert.equal(read('isa.log').trim(), 'native ISA SSE2=1 AVX2=1');
          const layout = 'TestCrossLinuxRuntimeMatrixGoAMD64FixedLocalLayoutPartitions';
          const logical = 'TestCrossLinuxRuntimeMatrixGoAMD64FixedLocalLogicalLiterals';
          const shift = 'TestCrossLinuxRuntimeMatrixX86PackedShiftLiteralMasksOriginalGoAndLLVM';
          assert.match(output(layout), /axis=1 SSE2=1 /,
            'layout owner: actual native SSE2 preflight missing');
          assert.match(output(logical), /fixed-frame native AVX=1 AVX2=1/,
            'logical owner: actual native AVX2 instruction preflight missing');
          // The shift owner uses the plain native execution helper; it has no
          // axis=1 log. The shared host/ISA check and its actual run own this axis.
          for (const root of roots) {
            assert.doesNotMatch(output(root), /Rosetta|explicit authenticated guest transport/,
              root + ': guest execution cannot qualify this native job');
          }
          const once = (test, summary) => assert.equal(output(test).split(summary).length - 1, 1,
            test + ': complete runtime summary absent or duplicated');
          once(layout, 'native private-layout inventory: functions=3 inputs=7 observations_per_program=21 APIs=3 optimizations=2 execute=true');
          once(logical, '45 original kernels, 256 samples, disjoint/overlapping inputs and outputs, both complete 96-byte buffers; execute=true');
          once(shift, '36 original Go legacy SSE kernels × all 256 byte values; independent C byte oracle; 3 APIs × llc O0/O2; other vector bytes intentionally not initialized');
          const cases = {
            layoutPartitions: {functions: 3, inputs: 7, APIs: 3, optimizations: 2,
              originalObservations: 21, LLVMComparisons: 126},
            logicalLiterals: {functions: 45, inputs: 256, aliasModes: 2, APIs: 3, optimizations: 2,
              originalObservations: 23040, LLVMComparisons: 138240},
            shiftMasks: {functions: 36, inputs: 256, APIs: 3, optimizations: 2,
              originalObservations: 9216, LLVMComparisons: 55296},
          };
          const sourceFiles = [...new Set([
            ...owners.map(owner => owner.source),
            'amd64_fixed_local_data_address_runtime_go127_test.go',
            'amd64_fixed_local_layout_partition_test.go',
            'amd64_fixed_local_layout.go',
            'amd64_fixed_local_proof.go',
            'amd64_fixed_local_logical_literal_runtime_go127_test.go',
            'amd64_fixed_local_logical_literal_objects_go127_test.go',
            'amd64_fixed_local_logical_literal_go127_test.go',
            'amd64_fixed_local_logical_literal_test.go',
            'amd64_fixed_local_vex_native_linux_amd64_test.go',
            'amd64_fixed_local_original_test.go',
            'amd64_packed_shift_literal.go',
            'amd64_packed_shift_literal_mask_test.go',
            'amd64_float_compare_transport_test.go',
            'amd64_float_compare_runtime_axes_test.go',
            'amd64_float_add_sub_numerical_test.go',
          ])];
          const crypto = require('node:crypto');
          const sourceHashes = Object.fromEntries(sourceFiles.map(file =>
            [file, crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex')]));
          process.stdout.write(JSON.stringify({...result, source: read('source.txt').trim(),
            head: read('head.txt').trim(), platform: 'native linux/amd64', execute: true,
            scope, cases, ownerInventory: owners, sourceHashes,
            limits: ['Only the selected roots and complete observed children qualify',
              'This SSE2/AVX2 native probe does not establish native AVX512 acceptance',
              'Selected kernels do not establish complete SHA1, P256 or standard-library execution',
              'Program stdout is checked by the frozen tests, not retained separately'],
          }, null, 2) + '\n');
          NODE

      - name: Retain raw failures and complete qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: layout-literal-${{ matrix.scope }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: _out/layout-literal-execution/
          if-no-files-found: error
          retention-days: 7
