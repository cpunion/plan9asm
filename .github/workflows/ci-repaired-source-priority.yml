name: Repaired source priority (fork diagnostic)

on:
  push:
    branches: [codex/ci-priority-3c460-20261103]

permissions:
  contents: read

jobs:
  repaired-source:
    if: github.repository == 'cpunion/plan9asm'
    name: Repaired source / Go ${{ matrix.go }} / part ${{ matrix.part }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        go: ['1.27.3', '1.20.14']
        part: [0, 1, 2, 3]
    env:
      GOFLAGS: ''
      GOENV: 'off'
      GOWORK: 'off'
      GOTOOLCHAIN: local
      GOMAXPROCS: '4'
      CGO_ENABLED: '1'
      LLVM_CONFIG: llvm-config-22
      CC: clang-22
      CXX: clang++-22
      CGO_CXXFLAGS: -std=c++17
      LD_LIBRARY_PATH: /usr/lib/llvm-22/lib
    steps:
      - name: Checkout diagnostic plumbing
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Retain diagnostic inputs separately from the product
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/repaired-source-diagnostic"
          cp .github/diagnostics/repaired-source-priority.py .github/diagnostics/repaired-source-priority.json "$RUNNER_TEMP/repaired-source-diagnostic/"
          git rev-parse HEAD > "$RUNNER_TEMP/repaired-source-diagnostic/workflow-head.txt"
          sha256sum "$RUNNER_TEMP/repaired-source-diagnostic/"* > "$RUNNER_TEMP/repaired-source-diagnostic/diagnostic-inputs.sha256"
      - name: Checkout exact product independently
        uses: actions/checkout@v7
        with:
          ref: 3c460f56725dc0961a658aa103adb84e0d525e63
          persist-credentials: false
      - name: Require exact product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 3c460f56725dc0961a658aa103adb84e0d525e63
          test -z "$(git status --porcelain)"
      - name: Install LLVM 22 and cross compilers
        timeout-minutes: 14
        run: bash scripts/install-ci-llvm22-ubuntu.sh gcc-i686-linux-gnu libc6-dev-i386-cross gcc-aarch64-linux-gnu
      - name: Setup exact Go
        uses: ./.github/actions/setup-go
        timeout-minutes: 10
        with:
          go-version: ${{ matrix.go }}
      - name: Setup required Node runtime
        uses: ./.github/actions/setup-node22
        timeout-minutes: 10
      - name: Observe LLVM build flags
        shell: bash
        run: |
          set -euo pipefail
          test "$(llvm-config-22 --version | cut -d. -f1)" = 22
          echo "CGO_CPPFLAGS=$(llvm-config-22 --cppflags)" >> "$GITHUB_ENV"
          echo "CGO_LDFLAGS=$(llvm-config-22 --ldflags) $(llvm-config-22 --libs all)" >> "$GITHUB_ENV"
      - name: Execute original strict selected owners
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/repaired-source-diagnostic/repaired-source-priority.py" \
            --go-version '${{ matrix.go }}' --owner '${{ matrix.part }}' \
            --out '_out/repaired-source-priority'
      - name: Retain actual partial evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: repaired-source-${{ matrix.go }}-part-${{ matrix.part }}
          path: |
            _out/repaired-source-priority/
            ${{ runner.temp }}/repaired-source-diagnostic/
          if-no-files-found: error
