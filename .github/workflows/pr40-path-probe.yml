name: PR40 Windows path diagnostic
on:
  push:
    branches: [codex/pr40-windows-path-probe-20261012]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          go-version: '1.27.2'
          cache: false
      - name: Go 1.20 module defaults
        run: go run ./.github/path-probe
      - name: Current junction behavior
        env:
          GODEBUG: winsymlink=1,winreadlinkvolume=1
        run: go run ./.github/path-probe
      - name: Current junction and legacy volume behavior
        env:
          GODEBUG: winsymlink=1,winreadlinkvolume=0
        run: go run ./.github/path-probe
      - name: Go 1.24 module defaults
        working-directory: cmd/plan9asmll
        run: go run ../../.github/path-probe
      - name: Required actual junction regression
        run: go test ./internal/sourcepath -count=1 -v
