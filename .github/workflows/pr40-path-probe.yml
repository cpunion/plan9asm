name: PR40 Windows path diagnostic
on:
  push:
    branches: [codex/pr40-windows-path-probe-20261012]
permissions:
  contents: read
jobs:
  integration:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        role: [source-observation, complete-cli]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: ./.github/actions/setup-windows-llvm22
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Required actual junction and source containment regressions
        if: matrix.role == 'source-observation'
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/sourcepath ./gotoolprofile -run '^(TestResolve.*|TestWindowsDOSPath.*|TestCPP.*|TestFeatureSubtool.*|TestInstrumentationExportRecheck.*)$' -count=1 -v -timeout=20m
      - name: Actual original Go and C observation and source include regressions
        if: ${{ !cancelled() && matrix.role == 'source-observation' }}
        shell: bash
        run: |
          set -euo pipefail
          go test . -run '^(TestReadGoAssemblySource.*|TestX86CMPXCHGOriginalGoAndCCompleteObservationEquivalence|TestX86CMPXCHGActualObservationPacketRejectsIncompleteTransport)$' -count=1 -v -timeout=20m
      - name: Complete LLVM CLI with coverage
        if: matrix.role == 'complete-cli'
        working-directory: cmd/plan9asmll
        shell: bash
        run: |
          set -euo pipefail
          go test ./... -count=1 -v -timeout=30m -coverprofile=../../coverage-windows-plan9asmll.out
          test -s ../../coverage-windows-plan9asmll.out
