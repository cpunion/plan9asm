name: PR40 Windows path diagnostic
on:
  push:
    branches: [codex/pr40-windows-path-probe-20261012]
permissions:
  contents: read
jobs:
  integration:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        role: [portable-selection, cpp-cli, ordinary-cli, arm64-scratch, instrumentation-cli]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: ./.github/actions/setup-windows-llvm22
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Portable original source selection and mutation controls
        if: matrix.role == 'portable-selection'
        shell: bash
        run: |
          set -euo pipefail
          go test ./gotoolprofile -run '^(TestPortableSelection.*|TestOrdinaryDependencyCompleteClosureRejectsMutation|TestOrdinarySourceInventoryLiveGuards|TestTest.*Embed.*)$' -count=1 -v -timeout=15m
      - name: Actual source metadata slash regression
        if: matrix.role == 'arm64-scratch'
        shell: bash
        run: |
          set -euo pipefail
          go test . -run '^TestARM64NativeScratchObjectSourceMetadataRequiresCapturedPhysicalInput$' -count=1 -v -timeout=10m
      - name: CPP and generated headers on all targets
        if: matrix.role == 'cpp-cli'
        working-directory: cmd/plan9asmll
        shell: bash
        run: |
          set -euo pipefail
          go test . -run '^(TestFeatureCPP.*|TestGeneratedHeader.*|TestAMD64DownloadedFixedLocalActualProfileCLI)$' -count=1 -v -timeout=25m
      - name: Ordinary actual source and supplemental test declarations
        if: matrix.role == 'ordinary-cli'
        working-directory: cmd/plan9asmll
        shell: bash
        run: |
          set -euo pipefail
          go test . -run '^(TestOrdinary.*|TestTest.*)$' -count=1 -v -timeout=25m
      - name: Actual ARM64 source and native scratch closure
        if: ${{ !cancelled() && matrix.role == 'arm64-scratch' }}
        working-directory: cmd/plan9asmll
        shell: bash
        run: |
          set -euo pipefail
          go test . -run '^TestCompileOneARM64NativeScratch.*$' -count=1 -v -timeout=15m
      - name: Same-source type recapture and instrumentation
        if: matrix.role == 'instrumentation-cli'
        working-directory: cmd/plan9asmll
        shell: bash
        run: |
          set -euo pipefail
          go test . -run '^TestInstrumentation.*$' -count=1 -v -timeout=25m
