name: PR40 Windows inventory diagnostic
on:
  push:
    branches: [codex/pr40-windows-path-probe-20261012]
permissions:
  contents: read
jobs:
  integration:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        role: [cli, profile]
        part: [0, 1, 2, 3]
        include:
          - role: root-failed
            part: 0
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: ./.github/actions/setup-windows-llvm22
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Diagnose every actual inventory root in disjoint groups
        if: matrix.role != 'root-failed'
        shell: pwsh
        run: python .github/scripts/pr40-inventory-probe.py '${{ matrix.role }}' '${{ matrix.part }}'
      - name: Recheck original failing native observations and conversion objects
        if: matrix.role == 'root-failed'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _out/windows-root-failed-0
          go test . -count=1 -timeout=30m -v -run='^(TestX86CMPXCHGOriginalGoAndCCompleteObservationEquivalence|TestX86CMPXCHGActualObservationPacketRejectsIncompleteTransport|TestGoAMD64FixedLocalConversionActualObjects|TestGoAMD64FixedLocalReadonlyDataThreeTargetObjects)$' 2>&1 | tee _out/windows-root-failed-0/run.log
      - name: Retain actual inventory and raw outcomes
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: windows-${{ matrix.role }}-${{ matrix.part }}
          path: _out/windows-${{ matrix.role }}-${{ matrix.part }}/
          if-no-files-found: error
