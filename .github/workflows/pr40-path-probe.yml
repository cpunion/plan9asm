name: PR40 Windows remaining failures
on:
  push:
    branches: [codex/pr40-windows-path-probe-20261012]
permissions:
  contents: read
jobs:
  integration:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        role: [metadata-and-crc]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: ./.github/actions/setup-windows-llvm22
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Exact original object source spellings
        if: matrix.role == 'metadata-and-crc'
        shell: bash
        run: |
          set -euo pipefail
          go test . -run '^(TestARM64NativeScratchObjectSourceMetadataRequiresCapturedPhysicalInput|TestGoX86SDKNumericalReadLiteralObjectSourceNames|TestGoX86SDKASMDataImportConfigNativePaths)$' -count=1 -v -timeout=10m
      - name: Actual SDK CRC32 source reload and objects
        if: ${{ !cancelled() && matrix.role == 'metadata-and-crc' }}
        shell: bash
        working-directory: cmd/plan9asmll
        run: |
          set -euo pipefail
          go test . -run '^(TestX86SDKNumericalReloadPhysicalSourceIdentity|TestCompileOneX86SDKOriginalCRC32NumericalDataJoin)$' -count=1 -v -timeout=15m
      - name: Actual quoted original export and strict nm grammar
        if: matrix.role == 'quoted-export'
        shell: bash
        run: |
          set -euo pipefail
          go test ./gotoolprofile -run '^(TestInstrumentationExportNM.*|TestInstrumentationExportActualGoQuotedOwnedPath)$' -count=1 -v -timeout=10m
