name: Setup Go
description: Set up Go with writable caches on hosted and self-hosted runners

inputs:
  go-version:
    description: Go version accepted by actions/setup-go
    required: true
  cache:
    description: Whether actions/setup-go should cache dependencies
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Configure writable Go paths
      shell: bash
      run: |
        echo "GOPATH=${RUNNER_TEMP}/go" >> "$GITHUB_ENV"
        echo "GOBIN=${RUNNER_TEMP}/go/bin" >> "$GITHUB_ENV"
        echo "GOMODCACHE=${RUNNER_TEMP}/go/pkg/mod" >> "$GITHUB_ENV"
        echo "GOCACHE=${RUNNER_TEMP}/go-build-cache" >> "$GITHUB_ENV"

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ inputs.go-version }}
        cache: ${{ inputs.cache }}
